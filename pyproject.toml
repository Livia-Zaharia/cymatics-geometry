[project]
name = "cymatics-geometry"
version = "0.1.0"
description = "Cymatics plane-to-line geometry: 100×100 point grid displaced by four-corner wave interference"
readme = "README.md"
authors = [
    { name = "Livia Zaharia", email = "livia@glucosedao.org" },
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "pyvista>=0.44",
    "scipy>=1.14",
    "trimesh>=4.0",
    "typer>=0.15",
    "ipywidgets>=8.1",
    "jupyterlab>=4.0",
    "matplotlib>=3.9",
    "plotly>=6.9.0",
    "anywidget>=0.11.0",
    "picopie>=0.7.0",
]

[project.scripts]
cymatics = "cymatics_geometry.cli:main"

[build-system]
requires = ["uv-build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]
